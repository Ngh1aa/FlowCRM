        <div class="sidebar-footer">
          <div class="user-profile" id="userProfile">
            <div class="user-avatar">AN</div>

              <div class="user-name">An Nguyen</div>
              <div class="user-role">Sales manager</div>
            </div>
          </div>
        </div>

      <!-- Main Content -->
      <main class="main-content" id="mainContent" tabindex="-1">
        <header class="topbar">
          <div class="topbar-left">
            <div>
              <h1 class="page-title">Tasks</h1>
            </div>
          </div>
          <div class="topbar-right">
            <button class="btn btn-primary" id="addTaskBtn">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
              Add task
            </button>
          </div>
        </header>

        <div class="page-content">
          <section
            class="task-dashboard-redesign"
            aria-label="CRM task board"
          >
            <section class="task-worklist" aria-labelledby="taskWorklistTitle">
              <header class="task-worklist-header">
                <h2 id="taskWorklistTitle">Task list</h2>
                <div class="task-filters" aria-label="Filter tasks" role="group">
                  <button type="button" class="task-filter active" data-filter="all" aria-pressed="true">All</button>
                  <button type="button" class="task-filter" data-filter="overdue" aria-pressed="false">Overdue</button>
                  <button type="button" class="task-filter" data-filter="today" aria-pressed="false">Today</button>
                  <button type="button" class="task-filter" data-filter="upcoming" aria-pressed="false">Upcoming</button>
                  <button type="button" class="task-filter" data-filter="completed" aria-pressed="false">Completed</button>
                </div>
              </header>
              <div class="tasks-list" id="tasksList"></div>
              <p id="tasksEmpty" class="workspace-empty" role="status" hidden>No tasks in this group.</p>
            </section>
            <section class="deal-follow-ups" id="dealFollowUps" aria-labelledby="dealFollowUpsTitle">
              <h2 id="dealFollowUpsTitle">Deal follow-ups</h2>
              <div id="dealFollowUpsEmpty">
                <p>No follow-up plans yet.</p>
                <a href="pipeline.html">Open Pipeline</a>
              </div>
              <div id="dealFollowUpsList"></div>
            </section>
          </section>
        </div>
      </main>
    </div>

    <!-- Add Task Modal -->
    <div class="modal-overlay" id="addTaskModal">
      <div class="modal">
        <div class="modal-header">
          <h2 class="modal-title">New task</h2>
          <button class="modal-close" id="closeModalBtn" aria-label="Close dialog">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <form id="addTaskForm">
            <div class="form-group">
              <label class="form-label required" for="taskTitle">Task name</label>
              <input
                type="text"
                class="form-input"
                id="taskTitle"
                placeholder="Enter a task name..."
                required
              />
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="taskDeadline">Due date</label>
                <input type="date" class="form-input" id="taskDeadline" />
              </div>
              <div class="form-group">
                <label class="form-label" for="taskTime">Time</label>
                <input type="time" class="form-input" id="taskTime" />
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="taskDeal">Related deal</label>
              <select class="form-select" id="taskDeal">
                <option value="">Select a deal...</option>
                <option value="1">Website Redesign - Lotus Bay Hotels</option>
                <option value="2">
                  Mobile App Development - Brightline Logistics
                </option>
                <option value="3">CRM Integration - Mai Anh Interiors</option>
                <option value="4">Cloud Migration - Northstar Pharma</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="taskDescription">Description</label>
              <textarea
                class="form-input"
                id="taskDescription"
                rows="3"
                placeholder="Describe the task..."
              ></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
          <button class="btn btn-primary" id="saveTaskBtn">Create task</button>
        </div>
      </div>
    </div>

    <script src="assets/js/app.js"></script>
    <script src="assets/js/deal-follow-up.js" defer></script>
    <script src="assets/js/auth.js"></script>
    <script>
      function renderUserProfile() {
        const user = Auth.getCurrentUser();
        const profileEl = document.getElementById("userProfile");
        if (!user || !profileEl) return;

        profileEl.innerHTML = `
        <div class="user-avatar">${escapeText(user.avatar)}</div>
        <div class="user-info">
          <div class="user-name">${escapeText(user.name)}</div>
          <div class="user-role">${Auth.getRoleDisplayName(user.role, user)}</div>
        </div>
        <button class="logout-btn" id="logoutBtn" title="Log out" aria-label="Log out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      `;

        const logoutBtn = document.getElementById("logoutBtn");
        if (logoutBtn) {
          logoutBtn.addEventListener("click", () => {
            Auth.logout();
          });
        }
      }
      window.addEventListener("auth_state_changed", renderUserProfile);
      renderUserProfile();

      const taskTabs = document.querySelectorAll(
        ".task-dashboard-redesign .task-dashboard-tab",
      );
      const taskSections = document.querySelectorAll(
        ".task-dashboard-redesign .task-list-section",
      );

      taskTabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          const view = tab.dataset.taskView;

          taskTabs.forEach((item) => item.classList.remove("active"));
          tab.classList.add("active");

          taskSections.forEach((section) => {
            const rows = section.querySelectorAll(".task-row");

            rows.forEach((row) => {
              const status = row.dataset.taskStatus || "";
              const showRow =
                view === "all" ||
                (view === "overdue" && status === "overdue") ||
                (view === "today" && status === "today") ||
                (view === "upcoming" &&
                  (status === "tomorrow" || status === "upcoming")) ||
                (view === "completed" && row.classList.contains("completed"));
              row.hidden = !showRow;
            });

            const hasVisibleRows = Array.from(rows).some((row) => !row.hidden);
            section.hidden = !hasVisibleRows;
          });
        });
      });
    </script>
