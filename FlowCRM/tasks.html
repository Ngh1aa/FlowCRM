                <polyline points="14 2 14 8 20 8" />

        <div class="sidebar-footer">
          <div class="user-profile" id="userProfile">
            <div class="user-avatar">AN</div>
            <div class="user-info">
              <div class="user-name">An Nguyen</div>
              <div class="user-role">Quản lý bán hàng</div>
            </div>
          </div>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="main-content" id="mainContent" tabindex="-1">
        <header class="topbar">
          <div class="topbar-left">
            <div>
              <h1 class="page-title">Nhiệm vụ</h1>
            </div>
          </div>
          <div class="topbar-right">
            <button class="btn btn-primary" id="addTaskBtn">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
              Thêm nhiệm vụ
            </button>
          </div>
        </header>

        <div class="page-content">
          <section
            class="task-dashboard-redesign"
            aria-label="Bảng nhiệm vụ CRM"
          >
            <section class="task-worklist" aria-labelledby="taskWorklistTitle">
              <header class="task-worklist-header">
                <h2 id="taskWorklistTitle">Danh sách nhiệm vụ</h2>
                <div class="task-filters" aria-label="Lọc nhiệm vụ" role="group">
                  <button type="button" class="task-filter active" data-filter="all" aria-pressed="true">Tất cả</button>
                  <button type="button" class="task-filter" data-filter="overdue" aria-pressed="false">Quá hạn</button>
                  <button type="button" class="task-filter" data-filter="today" aria-pressed="false">Hôm nay</button>
                  <button type="button" class="task-filter" data-filter="upcoming" aria-pressed="false">Sắp tới</button>
                  <button type="button" class="task-filter" data-filter="completed" aria-pressed="false">Hoàn thành</button>
                </div>
              </header>
              <div class="tasks-list" id="tasksList"></div>
              <p id="tasksEmpty" class="workspace-empty" role="status" hidden>Không có nhiệm vụ trong nhóm này.</p>
            </section>
            <section class="deal-follow-ups" id="dealFollowUps" aria-labelledby="dealFollowUpsTitle">
              <h2 id="dealFollowUpsTitle">Theo dõi cơ hội</h2>
              <div id="dealFollowUpsEmpty">
                <p>Chưa có kế hoạch theo dõi.</p>
                <a href="pipeline.html">Mở Pipeline</a>
              </div>
              <div id="dealFollowUpsList"></div>
            </section>
          </section>
        </div>
      </main>
    </div>

    <!-- Add Task Modal -->
    <div class="modal-overlay" id="addTaskModal">
      <div class="modal">
        <div class="modal-header">
          <h2 class="modal-title">Thêm nhiệm vụ mới</h2>
          <button class="modal-close" id="closeModalBtn" aria-label="Đóng hộp thoại">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <form id="addTaskForm">
            <div class="form-group">
              <label class="form-label required" for="taskTitle">Tên nhiệm vụ</label>
              <input
                type="text"
                class="form-input"
                id="taskTitle"
                placeholder="Nhập tên nhiệm vụ..."
                required
              />
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="taskDeadline">Hạn chót</label>
                <input type="date" class="form-input" id="taskDeadline" />
              </div>
              <div class="form-group">
                <label class="form-label" for="taskTime">Giờ</label>
                <input type="time" class="form-input" id="taskTime" />
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="taskDeal">Cơ hội liên quan</label>
              <select class="form-select" id="taskDeal">
                <option value="">Chọn deal...</option>
                <option value="1">Thiết kế lại website - Công ty ABC</option>
                <option value="2">
                  Phát triển ứng dụng di động - Tech Solutions
                </option>
                <option value="3">Tích hợp CRM - Design Co</option>
                <option value="4">Chuyển đổi lên đám mây - Alpha Corp</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="taskDescription">Mô tả</label>
              <textarea
                class="form-input"
                id="taskDescription"
                rows="3"
                placeholder="Mô tả nhiệm vụ..."
              ></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="cancelBtn">Hủy</button>
          <button class="btn btn-primary" id="saveTaskBtn">Tạo nhiệm vụ</button>
        </div>
      </div>
    </div>

    <script src="assets/js/app.js"></script>
    <script src="assets/js/deal-follow-up.js" defer></script>
    <script src="assets/js/auth.js"></script>
    <script>
      function renderUserProfile() {
        const user = Auth.getCurrentUser();
        const profileEl = document.getElementById("userProfile");
        if (!user || !profileEl) return;

        profileEl.innerHTML = `
        <div class="user-avatar">${escapeText(user.avatar)}</div>
        <div class="user-info">
          <div class="user-name">${escapeText(user.name)}</div>
          <div class="user-role">${Auth.getRoleDisplayName(user.role)}</div>
        </div>
        <button class="logout-btn" id="logoutBtn" title="Đăng xuất" aria-label="Đăng xuất">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      `;

        const logoutBtn = document.getElementById("logoutBtn");
        if (logoutBtn) {
          logoutBtn.addEventListener("click", () => {
            Auth.logout();
          });
        }
      }
      window.addEventListener("auth_state_changed", renderUserProfile);
      renderUserProfile();

      const taskTabs = document.querySelectorAll(
        ".task-dashboard-redesign .task-dashboard-tab",
      );
      const taskSections = document.querySelectorAll(
        ".task-dashboard-redesign .task-list-section",
      );

      taskTabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          const view = tab.dataset.taskView;

          taskTabs.forEach((item) => item.classList.remove("active"));
          tab.classList.add("active");

          taskSections.forEach((section) => {
            const rows = section.querySelectorAll(".task-row");

            rows.forEach((row) => {
              const status = row.dataset.taskStatus || "";
              const showRow =
                view === "all" ||
                (view === "overdue" && status === "overdue") ||
                (view === "today" && status === "today") ||
                (view === "upcoming" &&
                  (status === "tomorrow" || status === "upcoming")) ||
                (view === "completed" && row.classList.contains("completed"));
              row.hidden = !showRow;
            });

            const hasVisibleRows = Array.from(rows).some((row) => !row.hidden);
            section.hidden = !hasVisibleRows;
          });
        });
      });
    </script>
  </body>
