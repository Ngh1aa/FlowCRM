<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowCRM - Log in</title>
  <script src="assets/js/auth.js"></script>
  <script>
    const requestedPage = new URLSearchParams(window.location.search).get('redirect') || '';
    const workPages = ['index.html', 'pipeline.html', 'calendar.html', 'tasks.html', 'customers.html', 'messages.html', 'reports.html', 'settings.html'];
    const requestedDestination = workPages.includes(requestedPage.split(/[?#]/, 1)[0]) ? requestedPage : '';
    const destination = requestedDestination || 'index.html';
    // Shared deep links keep working for visitors who have not signed out.
    if (requestedDestination && !Auth.isAuthenticated() && !Auth.wasSignedOut()) {
      Auth.signInDefault();
    }
    if (Auth.isAuthenticated()) {
      window.location.replace(destination);
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/design-system.css">
  <script src="assets/js/shell.js" defer></script>
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body class="auth-page">
  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="4" width="28" height="28" rx="7" fill="currentColor" fill-opacity="0.1"/>
            <path d="M9 11h10M9 18h14M9 25h8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="23" cy="11" r="2.5" fill="currentColor" opacity="0.7"/>
          </svg>
          <span>FlowCRM</span>
        </div>
        <h1 class="auth-title">Log in</h1>
      </div>

      <form class="auth-form" id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" name="email" class="form-input" placeholder="email@company.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
        </div>

        <div class="form-row-between">
          <label class="checkbox-label">
            <input type="checkbox" id="remember" name="remember">
            <span class="checkbox-custom"></span>
            <span>Remember me</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="loginBtn">
          <span class="btn-text">Log in</span>
          <span class="btn-loader" style="display: none;">
            <svg class="spinner" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none" stroke-dasharray="31.4 31.4" transform="rotate(-90 12 12)"/>
            </svg>
          </span>
        </button>

        <div class="auth-divider">
          <span>or</span>
        </div>

        <button type="button" class="btn btn-secondary btn-full" id="continueAsBtn">
          <span class="continue-avatar" id="continueAsAvatar" aria-hidden="true">AN</span>
          <span id="continueAsLabel">Continue as An Nguyen</span>
        </button>
      </form>

      <div class="auth-footer">
        <p class="auth-register-prompt">
          No account yet? <a href="register.html" id="registerLink">Sign up</a>
        </p>
      </div>
    </div>
  </main>

  <div class="toast-container" id="toastContainer" role="status"></div>

  <script>
    // Login form submission
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const btnText = loginBtn.querySelector('.btn-text');
    const btnLoader = loginBtn.querySelector('.btn-loader');
    const toastContainer = document.getElementById('toastContainer');

    function showToast(message, type = 'error') {
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="toast-icon">
          ${type === 'error' ? '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>' : '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>'}
        </svg>
        <span>${message}</span>
      `;
      toastContainer.appendChild(toast);

      setTimeout(() => {
        toast.classList.add('toast-out');
        setTimeout(() => toast.remove(), 200);
      }, 4000);
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      // Show loading state
      btnText.style.display = 'none';
      btnLoader.style.display = 'inline-flex';
      loginBtn.disabled = true;

      try {
        await Auth.login(email, password);
        window.location.replace(destination);
      } catch (error) {
        showToast(error.message);
        btnText.style.display = 'inline';
        btnLoader.style.display = 'none';
        loginBtn.disabled = false;
      }
    });

    // One-click sign-in for the remembered workspace account
    const continueAsBtn = document.getElementById('continueAsBtn');
    const rememberedUser = Auth.getDefaultUser();
    if (rememberedUser) {
      document.getElementById('continueAsLabel').textContent = 'Continue as ' + rememberedUser.name;
      document.getElementById('continueAsAvatar').textContent = rememberedUser.avatar;
      continueAsBtn.addEventListener('click', () => {
        Auth.signInDefault();
        window.location.replace(destination);
      });
    } else {
      continueAsBtn.hidden = true;
    }
  </script>
</body>
</html>
