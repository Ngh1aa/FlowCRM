<body class="settings-page">

        <div class="nav-section">

          <a href="pipeline.html" class="nav-item" aria-label="Pipeline">

              <path d="M9 17V7m0 10l-3-3m3 3l3-3M21 7H3"/>

            <span>Pipeline</span>

          </a>
          <a href="customers.html" class="nav-item" aria-label="Khách hàng">

            </svg>

          <a href="messages.html" class="nav-item" aria-label="Tin nhắn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
            <span>Tin nhắn</span>
          </a>
        </div>

        <div class="nav-section">
          <div class="nav-section-title">Công việc</div>
          <a href="tasks.html" class="nav-item" aria-label="Nhiệm vụ">

              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            <span>Lịch hẹn</span>
          </a>
        </div>

        <div class="nav-section">
          <div class="nav-section-title">KHÁC</div>
          <a href="reports.html" class="nav-item" aria-label="Báo cáo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">

          <a href="settings.html" class="nav-item active" aria-label="Cài đặt" aria-current="page">

              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>

      <div class="sidebar-footer">
        <div class="user-profile" id="userProfile">
          <div class="user-avatar">AN</div>

            <div class="user-role">Quản lý bán hàng</div>

    <main class="main-content" id="mainContent" tabindex="-1">

        <div class="topbar-left">

      <div class="page-content">
        <div class="settings-layout" id="settingsContent">
          <!-- Content loaded dynamically -->
        </div>
      </div>

  <!-- User Edit Modal -->
  <div class="modal-overlay" id="userModal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="userModalTitle">Thêm người dùng</h2>
        <button class="modal-close" id="closeUserModalBtn" aria-label="Đóng hộp thoại">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <form id="userForm">
          <input type="hidden" id="editUserId">
          <div class="form-group">
            <label class="form-label required" for="userName">Họ và tên</label>
            <input type="text" id="userName" class="form-input" placeholder="Nguyễn Văn A" required>
          </div>
          <div class="form-group">
            <label class="form-label required" for="userEmail">Email</label>
            <input type="email" id="userEmail" class="form-input" placeholder="email@company.com" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="userRole">Vai trò</label>
            <select id="userRole" class="form-select">
              <option value="sales">Nhân viên bán hàng</option>
              <option value="manager">Quản lý</option>
              <option value="admin">Quản trị viên</option>
            </select>
          </div>
          <div class="form-group" id="passwordGroup">
            <label class="form-label required" for="userPassword">Mật khẩu</label>
            <input type="password" id="userPassword" class="form-input" placeholder="Ít nhất 6 ký tự" minlength="6">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelUserBtn">Hủy</button>
        <button class="btn btn-primary" id="saveUserBtn">Lưu</button>
      </div>
    </div>
  </div>

  <script src="assets/js/auth.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    function renderUserProfile() {
      const user = Auth.getCurrentUser();
      const profileEl = document.getElementById('userProfile');
      if (!user || !profileEl) return;

      profileEl.innerHTML = `
        <div class="user-avatar">${escapeText(user.avatar)}</div>
        <div class="user-info">
          <div class="user-name">${escapeText(user.name)}</div>
          <div class="user-role">${Auth.getRoleDisplayName(user.role)}</div>
        </div>
        <button class="logout-btn" id="logoutBtn" title="Đăng xuất" aria-label="Đăng xuất">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      `;

      const logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', () => {
          Auth.logout();
        });
      }
    }

    window.addEventListener('auth_state_changed', renderUserProfile);

    // Toast notification
    function showToast(message, type = 'error') {
      const container = document.getElementById('toastContainer') || (() => {
        const c = document.createElement('div');
        c.id = 'toastContainer';
        c.className = 'toast-container';
        document.body.appendChild(c);
        return c;
      })();

      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="toast-icon">
          ${type === 'error' ? '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>' : '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>'}
        </svg>
        <span>${message}</span>
      `;
      container.appendChild(toast);

      setTimeout(() => {
        toast.classList.add('toast-out');
        setTimeout(() => toast.remove(), 200);
      }, 4000);
    }

    // Render settings content based on user role
    function renderSettingsContent() {
      const user = Auth.getCurrentUser();
      const container = document.getElementById('settingsContent');
      if (!user || !container) return;

      const isAdmin = Auth.isAdmin();
      const preferenceLabels = [
        ['pipeline', 'Giai đoạn Pipeline', 'Bộ lọc áp dụng khi mở Pipeline.'],
        ['tasks', 'Nhóm nhiệm vụ', 'Nhóm hiển thị khi mở trang Nhiệm vụ.'],
        ['calendar', 'Chế độ xem lịch', 'Chế độ hiển thị khi mở Lịch hẹn.']
      ];
      const dataGroups = [
        ['deals', 'Cơ hội', Storage.KEYS.DEALS],
        ['customers', 'Khách hàng', Storage.KEYS.CUSTOMERS],
        ['tasks', 'Nhiệm vụ', Storage.KEYS.TASKS],
        ['events', 'Lịch hẹn riêng', Storage.KEYS.EVENTS]
      ];
      const preferenceRow = (name, label, help) => `
        <div class="settings-option">
          <div>
            <label for="preference-${name}">${label}</label>
            <p class="settings-description" id="preference-${name}-help">${help}</p>
          </div>
          <select class="form-select settings-select" id="preference-${name}" data-preference="${name}" aria-describedby="preference-${name}-help">
            ${WorkspacePreferences.options[name].map(([value, text]) =>
              `<option value="${value}" ${value === WorkspacePreferences.get(name) ? 'selected' : ''}>${text}</option>`).join('')}
          </select>
        </div>`;

      container.innerHTML = `
        <nav class="settings-nav" aria-label="Danh mục cài đặt">
          <a href="#ho-so">Hồ sơ</a>
          ${user.isDemo ? '' : '<a href="#bao-mat">Mật khẩu</a>'}
          <a href="#giao-dien">Giao diện</a>
          <a href="#cong-viec">Công việc</a>
          ${isAdmin ? '<a href="#du-lieu">Dữ liệu</a>' : ''}
          ${isAdmin ? '<a href="#nguoi-dung">Người dùng</a>' : ''}
        </nav>

        <section class="settings-section" data-settings-page="ho-so" aria-labelledby="profileHeading" hidden>
          <h2 id="profileHeading">Hồ sơ</h2>
          <div class="settings-identity">
            <span class="user-avatar" id="settingsAvatar" aria-hidden="true">${escapeText(user.avatar)}</span>
            <div><strong id="settingsName">${escapeText(user.name)}</strong><span>${Auth.getRoleDisplayName(user.role)}</span></div>
            ${user.isDemo ? '<span class="role-badge">Demo</span>' : ''}
          </div>
          ${user.isDemo ? `
            <dl class="settings-profile-data">
              <div><dt>Email</dt><dd>${escapeText(user.email)}</dd></div>
              <div><dt>Hồ sơ</dt><dd>Chỉ đọc</dd></div>
            </dl>` : `
            <form id="editProfileForm" class="form">
              <div class="form-group">
                <label class="form-label" for="profileName">Họ và tên</label>
                <input type="text" id="profileName" class="form-input" value="${escapeText(user.name)}" required>
              </div>
              <div class="form-group">
                <label class="form-label" for="profileEmail">Email</label>
                <input type="email" id="profileEmail" class="form-input" value="${escapeText(user.email)}" readonly>
              </div>
              <div class="form-group">
                <label class="form-label" for="profileRole">Vai trò</label>
                <input type="text" id="profileRole" class="form-input" value="${Auth.getRoleDisplayName(user.role)}" readonly>
              </div>
              <button type="submit" class="btn btn-primary">Lưu hồ sơ</button>
            </form>
          `}
          <div class="settings-summary">
            <h3>Chế độ xem mặc định</h3>
            <dl class="settings-profile-data" id="settingsViewSummary"></dl>
            <a class="settings-text-link" href="#cong-viec">Đổi chế độ xem</a>
          </div>
        </section>

        ${!user.isDemo ? `
        <section class="settings-section" data-settings-page="bao-mat" aria-labelledby="passwordHeading" hidden>
          <h2 id="passwordHeading">Mật khẩu</h2>
            <form id="changePasswordForm" class="form">
              <div class="form-group">
                <label class="form-label" for="currentPassword">Mật khẩu hiện tại</label>
                <input type="password" id="currentPassword" class="form-input" required>
              </div>
              <div class="form-group">
                <label class="form-label" for="newPassword">Mật khẩu mới</label>
                <input type="password" id="newPassword" class="form-input" required minlength="6" placeholder="Ít nhất 6 ký tự">
              </div>
              <div class="form-group">
                <label class="form-label" for="confirmNewPassword">Xác nhận mật khẩu mới</label>
                <input type="password" id="confirmNewPassword" class="form-input" required minlength="6">
              </div>
              <button type="submit" class="btn btn-primary">Cập nhật mật khẩu</button>
            </form>
        </section>

        ` : ''}
        <section class="settings-section" data-settings-page="giao-dien" aria-labelledby="appearanceHeading" hidden>
          <h2 id="appearanceHeading">Giao diện</h2>
          <div class="settings-option">
            <div>
              <label for="sidebarCollapseDefault">Thu gọn thanh bên</label>
              <p class="settings-description" id="sidebarSettingHelp">Chỉ hiện biểu tượng trên desktop. Tự lưu trên trình duyệt này.</p>
            </div>
            <input class="settings-switch" type="checkbox" role="switch" id="sidebarCollapseDefault" aria-describedby="sidebarSettingHelp" ${localStorage.getItem('flowcrm_sidebar_collapsed') === 'true' ? 'checked' : ''}>
          </div>
          ${preferenceRow('motion', 'Hiệu ứng chuyển động', 'Giảm hiệu ứng trên các màn làm việc.')}
          <p class="settings-status" id="appearanceStatus" role="status"></p>
        </section>

        <section class="settings-section" data-settings-page="cong-viec" aria-labelledby="workHeading" hidden>
          <h2 id="workHeading">Công việc</h2>
          <h3 class="settings-subheading">Chế độ xem mặc định</h3>
          ${preferenceLabels.map(args => preferenceRow(...args)).join('')}
          <div class="settings-footer">
            <button type="button" class="btn btn-secondary" id="resetWorkPreferences">Về mặc định</button>
            <p class="settings-status" id="workPreferencesStatus" role="status"></p>
          </div>
        </section>

        ${isAdmin ? `
        <section class="settings-section" data-settings-page="du-lieu" aria-labelledby="dataHeading" hidden>
          <h2 id="dataHeading">Dữ liệu</h2>
          <h3 class="settings-subheading">Bản ghi trên trình duyệt</h3>
          <dl class="settings-profile-data" id="settingsDataCounts"></dl>
          <div class="settings-data-export">
            <h3>Tải bản sao</h3>
            <p class="settings-description">Tệp JSON gồm các bản ghi bên trên. Kế hoạch theo dõi nằm trong bản ghi cơ hội.</p>
            <button type="button" class="btn btn-primary" id="exportWorkspaceData">Tải tệp JSON</button>
            <p class="settings-status" id="dataExportStatus" role="status"></p>
          </div>
        </section>` : ''}

        <!-- User Management Section (Admin only) -->
        ${isAdmin ? `
        <section class="settings-section" id="userManagementSection" data-settings-page="nguoi-dung" aria-labelledby="usersHeading" hidden>
          <div class="section-heading">
            <div>
              <h2 id="usersHeading">Người dùng</h2>
              <p class="settings-description" id="settingsUserCount"></p>
            </div>
            <button class="btn btn-primary" id="addUserBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
              Thêm người dùng
            </button>
          </div>
          <p id="usersEmpty" class="workspace-empty" hidden>Chưa có người dùng được tạo.</p>
          <div class="user-table-wrap" id="userTableWrap">
            <table class="user-table">
              <thead>
                <tr>
                  <th>Người dùng</th>
                  <th>Email</th>
                  <th>Vai trò</th>
                  <th>Hành động</th>
                </tr>
              </thead>
              <tbody id="userTableBody">
                <!-- Populated by JS -->
              </tbody>
            </table>
          </div>
        </section>
        ` : ''}

      `;

      const panels = [...container.querySelectorAll('[data-settings-page]')];
      const links = container.querySelectorAll('.settings-nav a');
      const viewSummary = document.getElementById('settingsViewSummary');
      function updateViewSummary() {
        viewSummary.innerHTML = preferenceLabels.map(([name, label]) => {
          const [, selected] = WorkspacePreferences.options[name].find(([value]) => value === WorkspacePreferences.get(name));
          return `<div><dt>${label}</dt><dd>${selected}</dd></div>`;
        }).join('');
      }
      updateViewSummary();

      const dataCounts = document.getElementById('settingsDataCounts');
      function updateDataCounts() {
        if (!dataCounts) return;
        dataCounts.innerHTML = dataGroups.map(([, label, key]) =>
          `<div><dt>${label}</dt><dd>${Storage.get(key).length}</dd></div>`).join('');
      }

      function showSettingsPage() {
        const active = panels.find(panel => '#' + panel.dataset.settingsPage === location.hash) || panels[0];
        for (const panel of panels) panel.hidden = panel !== active;
        for (const link of links) {
          if (link.hash === '#' + active.dataset.settingsPage) link.setAttribute('aria-current', 'location');
          else link.removeAttribute('aria-current');
        }
        if (active.dataset.settingsPage === 'du-lieu') updateDataCounts();
      }
      window.addEventListener('hashchange', showSettingsPage);
      showSettingsPage();

      const collapse = document.getElementById('sidebarCollapseDefault');
      const appearanceStatus = document.getElementById('appearanceStatus');
      const workStatus = document.getElementById('workPreferencesStatus');
      collapse.addEventListener('change', () => {
        localStorage.setItem('flowcrm_sidebar_collapsed', String(collapse.checked));
        window.dispatchEvent(new Event('flowcrm_sidebar_changed'));
        appearanceStatus.textContent = 'Đã lưu tùy chọn.';
      });
      window.addEventListener('flowcrm_sidebar_changed', () => {
        collapse.checked = localStorage.getItem('flowcrm_sidebar_collapsed') === 'true';
      });

      container.querySelectorAll('[data-preference]').forEach(select => {
        select.addEventListener('change', () => {
          const name = select.dataset.preference;
          WorkspacePreferences.set(name, select.value);
          (name === 'motion' ? appearanceStatus : workStatus).textContent = 'Đã lưu tùy chọn.';
          updateViewSummary();
        });
      });
      document.getElementById('resetWorkPreferences').addEventListener('click', () => {
        for (const [name] of preferenceLabels) {
          const [value] = WorkspacePreferences.options[name][0];
          WorkspacePreferences.set(name, value);
          document.getElementById('preference-' + name).value = value;
        }
        updateViewSummary();
        workStatus.textContent = 'Đã khôi phục chế độ xem mặc định.';
      });
      document.getElementById('exportWorkspaceData')?.addEventListener('click', () => {
        const status = document.getElementById('dataExportStatus');
        if (!Auth.isAdmin()) {
          status.textContent = 'Bạn cần quyền quản trị để tải dữ liệu.';
          return;
        }
        const records = Object.fromEntries(dataGroups.map(([name, , key]) => [name, Storage.get(key)]));
        const snapshot = { version: 1, exportedAt: new Date().toISOString(), ...records };
        const file = new Blob([JSON.stringify(snapshot, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(file);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'flowcrm-' + localDateKey(new Date()) + '.json';
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        status.textContent = 'Đã tạo tệp tải xuống.';
        updateDataCounts();
      });
      if (dataCounts) window.addEventListener('storage', updateDataCounts);

      // Attach form handlers
      attachFormHandlers();

      // Render user table if admin
      if (isAdmin) {
        renderUserTable();
        attachUserModalHandlers();
      }
    }

    function attachFormHandlers() {
      // Edit profile form
      const editProfileForm = document.getElementById('editProfileForm');
      if (editProfileForm && !Auth.getCurrentUser().isDemo) {
        editProfileForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const user = Auth.getCurrentUser();
          const newName = document.getElementById('profileName').value;

          try {
            const updated = Auth.updateProfile(user.id, { name: newName });
            document.getElementById('settingsName').textContent = updated.name;
            document.getElementById('settingsAvatar').textContent = updated.avatar;
            showToast('Cập nhật hồ sơ thành công', 'success');
            renderUserProfile();
          } catch (err) {
            showToast(err.message);
          }
        });
      }

      // Change password form
      const changePasswordForm = document.getElementById('changePasswordForm');
      if (changePasswordForm) {
        changePasswordForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const user = Auth.getCurrentUser();
          const currentPassword = document.getElementById('currentPassword').value;
          const newPassword = document.getElementById('newPassword').value;
          const confirmPassword = document.getElementById('confirmNewPassword').value;

          if (newPassword !== confirmPassword) {
            showToast('Mật khẩu xác nhận không khớp');
            return;
          }

          try {
            await Auth.changePassword(user.id, currentPassword, newPassword);
            showToast('Đổi mật khẩu thành công', 'success');
            changePasswordForm.reset();
          } catch (err) {
            showToast(err.message);
          }
        });
      }
    }

    function renderUserTable() {
      const tbody = document.getElementById('userTableBody');
      if (!tbody) return;

      const users = Auth.getUsers();
      document.getElementById('settingsUserCount').textContent = users.length + ' tài khoản lưu trong trình duyệt';
      document.getElementById('userTableWrap').hidden = users.length === 0;
      document.getElementById('usersEmpty').hidden = users.length > 0;
      const currentUser = Auth.getCurrentUser();

      tbody.innerHTML = users.map(user => `
        <tr>
          <td>
            <div style="display: flex; align-items: center; gap: 12px;">
              <div class="user-avatar" style="width: 32px; height: 32px; font-size: 12px;">${escapeText(user.avatar)}</div>
              <span>${escapeText(user.name)}</span>
            </div>
          </td>
          <td data-label="Email">${escapeText(user.email)}</td>
          <td data-label="Vai trò"><span class="role-badge">${Auth.getRoleDisplayName(user.role)}</span></td>
          <td class="settings-user-actions">
            <button class="btn btn-ghost btn-sm" aria-label="Sửa người dùng" onclick="editUser('${user.id}')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
            </button>
            ${user.id !== currentUser?.id ? `
              <button class="btn btn-ghost btn-sm" aria-label="Xóa người dùng" onclick="deleteUser('${user.id}')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                  <polyline points="3 6 5 6 21 6"/>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                </svg>
              </button>
            ` : ''}
          </td>
        </tr>
      `).join('');
    }

    function attachUserModalHandlers() {
      const modal = document.getElementById('userModal');
      const addUserBtn = document.getElementById('addUserBtn');
      const closeBtn = document.getElementById('closeUserModalBtn');
      const cancelBtn = document.getElementById('cancelUserBtn');
      const saveBtn = document.getElementById('saveUserBtn');
      const form = document.getElementById('userForm');
      const passwordGroup = document.getElementById('passwordGroup');

      if (addUserBtn) {
        addUserBtn.addEventListener('click', () => {
          document.getElementById('userModalTitle').textContent = 'Thêm người dùng';
          document.getElementById('editUserId').value = '';
          document.getElementById('userName').value = '';
          document.getElementById('userEmail').value = '';
          document.getElementById('userRole').value = 'sales';
          document.getElementById('userPassword').value = '';
          document.getElementById('userPassword').parentElement.querySelector('.form-label').classList.add('required');
          document.getElementById('userPassword').required = true;
          openModal(modal);
        });
      }

      if (closeBtn) {
        closeBtn.addEventListener('click', () => {
          closeModal(modal);
        });
      }

      if (cancelBtn) {
        cancelBtn.addEventListener('click', () => {
          closeModal(modal);
        });
      }

      if (saveBtn) {
        saveBtn.addEventListener('click', async () => {
          const editId = document.getElementById('editUserId').value;
          const name = document.getElementById('userName').value;
          const email = document.getElementById('userEmail').value;
          const role = document.getElementById('userRole').value;
          const password = document.getElementById('userPassword').value;

          if (!name || !email) {
            showToast('Vui lòng điền đầy đủ thông tin');
            return;
          }

          try {
            if (editId) {
              // Update existing user
              Auth.updateUser(editId, { name, email, role });
              showToast('Cập nhật người dùng thành công', 'success');
            } else {
              // Add new user
              if (!password) {
                showToast('Vui lòng nhập mật khẩu');
                return;
              }
              await Auth.addUser(name, email, password, role);
              showToast('Thêm người dùng thành công', 'success');
            }
            closeModal(modal);
            renderUserTable();
          } catch (err) {
            showToast(err.message);
          }
        });
      }
    }

    window.editUser = function(id) {
      const user = Auth.getUserById(id);
      if (!user) return;

      const modal = document.getElementById('userModal');
      document.getElementById('userModalTitle').textContent = 'Sửa người dùng';
      document.getElementById('editUserId').value = id;
      document.getElementById('userName').value = user.name;
      document.getElementById('userEmail').value = user.email;
      document.getElementById('userRole').value = user.role;
      document.getElementById('userPassword').value = '';
      document.getElementById('userPassword').parentElement.querySelector('.form-label').classList.remove('required');
      document.getElementById('userPassword').required = false;
      openModal(modal);
    };

    window.deleteUser = function(id) {
      if (!confirm('Bạn có chắc muốn xóa người dùng này?')) return;

      try {
        Auth.deleteUser(id);
        showToast('Xóa người dùng thành công', 'success');
        renderUserTable();
      } catch (err) {
        showToast(err.message);
      }
    };

    // Initial render
    renderUserProfile();
    renderSettingsContent();
  </script>
</body>
</html>
